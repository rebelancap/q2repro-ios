  # ---- Action Quake (aq2-tng), classic Q2 game API v3, static lib. Uses ONLY its own
  # headers (source/*.h). Its GetGameAPI is renamed GetGameAPI_action; every shared.c
  # export is renamed aq_* (gen-ios-sources.py --aqdefs) so nothing collides with the
  # engine. Runs through the engine's GetGame3Proxy (old-API) path when fs_game=action.
  aqgame:
    type: library.static
    platform: iOS
    settings:
      base:
        GCC_C_LANGUAGE_STANDARD: gnu11
        GCC_WARN_ABOUT_DEPRECATED_FUNCTIONS: NO
        CLANG_WARN_STRICT_PROTOTYPES: NO
        GCC_PREPROCESSOR_DEFINITIONS:
          - _GNU_SOURCE=1
          - GetGameAPI=GetGameAPI_action
          - AddPointToBounds=aq_AddPointToBounds
          - AngleVectors=aq_AngleVectors
          - BoxOnPlaneSide=aq_BoxOnPlaneSide
          - BoxOnPlaneSide2=aq_BoxOnPlaneSide2
          - COM_DefaultExtension=aq_COM_DefaultExtension
          - COM_FileBase=aq_COM_FileBase
          - COM_FileExtension=aq_COM_FileExtension
          - COM_FilePath=aq_COM_FilePath
          - COM_Parse=aq_COM_Parse
          - COM_SkipPath=aq_COM_SkipPath
          - COM_StripExtension=aq_COM_StripExtension
          - Com_PageInMemory=aq_Com_PageInMemory
          - Info_RemoveKey=aq_Info_RemoveKey
          - Info_SetValueForKey=aq_Info_SetValueForKey
          - Info_Validate=aq_Info_Validate
          - Info_ValueForKey=aq_Info_ValueForKey
          - LerpAngle=aq_LerpAngle
          - MakeNormalVectors=aq_MakeNormalVectors
          - PerpendicularVector=aq_PerpendicularVector
          - ProjectPointOnPlane=aq_ProjectPointOnPlane
          - Q_log2=aq_Q_log2
          - Q_stristr=aq_Q_stristr
          - Q_strlwr=aq_Q_strlwr
          - Q_strncatz=aq_Q_strncatz
          - Q_strncpyz=aq_Q_strncpyz
          - Q_strupr=aq_Q_strupr
          - Q_tolower=aq_Q_tolower
          - Q_toupper=aq_Q_toupper
          - R_ConcatRotations=aq_R_ConcatRotations
          - R_ConcatTransforms=aq_R_ConcatTransforms
          - RotatePointAroundVector=aq_RotatePointAroundVector
          - Sys_Error=aq_Sys_Error
          - VectorNormalize=aq_VectorNormalize
          - VectorNormalize2=aq_VectorNormalize2
          - VectorRotate2=aq_VectorRotate2
          - anglemod=aq_anglemod
          - ctf=aq_ctf
          - itemlist=aq_itemlist
          - paged_total=aq_paged_total
          - sv_airaccelerate=aq_sv_airaccelerate
          - va=aq_va
          - vec3_origin=aq_vec3_origin
          - vtos=aq_vtos
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../vendor/aq2-tng/source
        OTHER_CFLAGS:
          - -fsigned-char
          # -fcommon: classic Q2 game code declares globals (gi, level, itemlist, …) in
          # headers without `extern`; modern clang's -fno-common makes each TU's tentative
          # definition a strong symbol → duplicate-symbol link warnings/merges. -fcommon
          # restores common-symbol merging so each global is a single shared instance.
          - -fcommon
          - -Wno-implicit-function-declaration
          - -Wno-implicit-int
          - -Wno-int-conversion
          - -Wno-format
          - -Wno-deprecated-non-prototype
    sources:
      - path: ../vendor/aq2-tng/source/a_cmds.c
      - path: ../vendor/aq2-tng/source/a_ctf.c
      - path: ../vendor/aq2-tng/source/a_dom.c
      - path: ../vendor/aq2-tng/source/a_doorkick.c
